name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      # Genera el catálogo videos.json antes de compilar
      - name: Fetch Lulustream catalog
        env:
          LULU_API_KEY: ${{ secrets.LULU_API_KEY }}
        run: |
          curl -s "https://api.lulustream.com/api/file/list?key=$LULU_API_KEY&per_page=200" > public/videos.json

      - run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
